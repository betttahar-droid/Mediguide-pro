    const t0 = (r / RINGS) * Math.PI, t1 = ((r + 1) / RINGS) * Math.PI;
    for (let i = 0; i < N; i++) {
      const a0 = (i / N) * Math.PI * 2, a1 = ((i + 1) / N) * Math.PI * 2;
      const P = (t, a) => [Math.sin(t) * Math.cos(a) * knobR,
                           knobY + Math.cos(t) * knobR,
                           Math.sin(t) * Math.sin(a) * knobR];
      const U = (t, a) => [0.5 + 0.42 * Math.sin(t) * Math.cos(a),
                           0.98 - 0.30 * (t / Math.PI)];
      tri([P(t0, a0), P(t1, a0), P(t1, a1)], [U(t0, a0), U(t1, a0), U(t1, a1)]);
      tri([P(t0, a0), P(t1, a1), P(t0, a1)], [U(t0, a0), U(t1, a1), U(t0, a1)]);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  return g;
}

// A RECESS READS BECAUSE OF ITS LIP, NOT BECAUSE OF ITS HOLE.
//
// The first attempt sank the face behind the body's surface, and the screen's
// game art vanished -- because there IS no hole in the body to sink into, and
// an opaque front face simply occludes whatever is put behind it. The comment
// on the old code said exactly that, and I re-created the fault it was warning
// about, then blamed a winding.
//
// What makes a recess legible is the frame around it catching the light at a
// different angle from the face inside. That can be built proud of the surface
// instead of sunk into it: the artwork sits ON the body, and four walls flare
// forward and outward from its edge to a rim standing off by the part's own
// depth. From any angle a player will see, it reads as an opening with a
// bezel; and the art is in front of the body, so it is never occluded.
function recessGeometry(q, w, h, d) {
  const pos = [], uv = [];
  const quad = (P, U) => {
    pos.push(...P[0], ...P[1], ...P[2], ...P[0], ...P[2], ...P[3]);
    uv.push(...U[0], ...U[1], ...U[2], ...U[0], ...U[2], ...U[3]);
  };
  const X = w / 2, Y = h / 2, Z = d / 2;
  const ow = (q.u[1] - q.u[0]) * A, oh = q.v[1] - q.v[0];
  // the face, a hair proud of the body so the two are never coplanar
  const fz = -Z + 0.0015;
  for (const [x0, x1, y0, y1, u0, u1, v0, v1] of faceQuads(q, w, h, ow, oh)) {
    quad([[x0, y0, fz], [x1, y0, fz], [x1, y1, fz], [x0, y1, fz]],
         [[u0, v0], [u1, v0], [u1, v1], [u0, v1]]);
  }
  // the bezel: flaring outward as it comes forward, sampling the artwork's own
  // border the way the rims do, so the frame is lined in the part's colour
  const F = 1.10;
  const RX = X * F, RY = Y * F;
  quad([[-X, Y, fz], [X, Y, fz], [RX, RY, Z], [-RX, RY, Z]],
       [[0, 1], [1, 1], [1, 1], [0, 1]]);
  quad([[X, -Y, fz], [-X, -Y, fz], [-RX, -RY, Z], [RX, -RY, Z]],
       [[1, 0], [0, 0], [0, 0], [1, 0]]);
  quad([[-X, -Y, fz], [-X, Y, fz], [-RX, RY, Z], [-RX, -RY, Z]],
       [[0, 0], [0, 1], [0, 1], [0, 0]]);
  quad([[X, Y, fz], [X, -Y, fz], [RX, -RY, Z], [RX, RY, Z]],
       [[1, 1], [1, 0], [1, 0], [1, 1]]);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  return g;
}

// A BUTTON IS A CAP, NOT A TILE.
//
// A part you can press has relief by definition -- that is the whole of what
// distinguishes it from a sticker -- and every one of them was a flat quad
// lying on the panel. Two things had made that the sensible answer and neither
// is true any more. The fittings were thirteen texels across, so there was no
// relief a player could resolve and layer_build flattened them on sight; the
// detail pass now draws them at six times that. And boxes standing proud of a
// deck used to intersect the deck, because a part was seated on the BODY's
// surface however far its host stood out from it; riders sit on their host now.
//
// So a pressable fitting gets the shape it is: its face raised and inset, with
// a chamfer flaring down and out to its footprint. Five quads, no rounder than
// the artwork asks for -- the alpha still cuts the silhouette, so a round cap
// stays round and a rectangular one stays rectangular, and the chamfer samples
// the art just inside its own edge so it is lined in the cap's own colour
// rather than in whatever the border row happens to hold.
function capGeometry(q, w, h, d) {
  const pos = [], uv = [];
  const quad = (P, U) => {
    pos.push(...P[0], ...P[1], ...P[2], ...P[0], ...P[2], ...P[3]);
    uv.push(...U[0], ...U[1], ...U[2], ...U[0], ...U[2], ...U[3]);
  };
  const X = w / 2, Y = h / 2, Z = d / 2;
  const ow = (q.u[1] - q.u[0]) * A, oh = q.v[1] - q.v[0];
  const F = 0.82;
  for (const [x0, x1, y0, y1, u0, u1, v0, v1] of faceQuads(q, w, h, ow, oh)) {
    quad([[x0 * F, y0 * F, Z], [x1 * F, y0 * F, Z],
          [x1 * F, y1 * F, Z], [x0 * F, y1 * F, Z]],
         [[u0, v0], [u1, v0], [u1, v1], [u0, v1]]);
  }
  const e = (1 - F) / 2;
  const uL = e, uR = 1 - e, vB = e, vT = 1 - e;
  quad([[-X * F, Y * F, Z], [X * F, Y * F, Z], [X, Y, -Z], [-X, Y, -Z]],
       [[uL, vT], [uR, vT], [uR, vT], [uL, vT]]);
  quad([[X * F, -Y * F, Z], [-X * F, -Y * F, Z], [-X, -Y, -Z], [X, -Y, -Z]],
       [[uR, vB], [uL, vB], [uL, vB], [uR, vB]]);
  quad([[-X * F, -Y * F, Z], [-X * F, Y * F, Z], [-X, Y, -Z], [-X, -Y, -Z]],
       [[uL, vB], [uL, vT], [uL, vT], [uL, vB]]);
  quad([[X * F, Y * F, Z], [X * F, -Y * F, Z], [X, -Y, -Z], [X, Y, -Z]],
       [[uR, vT], [uR, vB], [uR, vB], [uR, vT]]);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  return g;
}

function partGeometry(q, w, h, d) {
  if ((q.motion || 'none') === 'stick') return stickGeometry(w, h, d);
  if ((q.motion || 'none') === 'press') return capGeometry(q, w, h, d);
  const pos = [], uv = [];
  const quad = (P, U) => {
    pos.push(...P[0], ...P[1], ...P[2], ...P[0], ...P[2], ...P[3]);
    uv.push(...U[0], ...U[1], ...U[2], ...U[0], ...U[2], ...U[3]);
  };
  const X = w / 2, Y = h / 2, Z = d / 2;
  const ow = (q.u[1] - q.u[0]) * A, oh = q.v[1] - q.v[0];
  for (const [x0, x1, y0, y1, u0, u1, v0, v1] of faceQuads(q, w, h, ow, oh)) {
    quad([[x0, y0, Z], [x1, y0, Z], [x1, y1, Z], [x0, y1, Z]],
         [[u0, v0], [u1, v0], [u1, v1], [u0, v1]]);
    // the back face, for a part swung open on a hinge -- same art, mirrored,
    // so the inside of a coin door is the door and not a hole
    quad([[x1, y0, -Z], [x0, y0, -Z], [x0, y1, -Z], [x1, y1, -Z]],
         [[u1, v0], [u0, v0], [u0, v1], [u1, v1]]);
  }
  // the four rims, each clamped to the border it was cut from
  quad([[-X, Y, Z], [X, Y, Z], [X, Y, -Z], [-X, Y, -Z]],
       [[0, 1], [1, 1], [1, 1], [0, 1]]);                    // top row
  quad([[X, -Y, Z], [-X, -Y, Z], [-X, -Y, -Z], [X, -Y, -Z]],
       [[1, 0], [0, 0], [0, 0], [1, 0]]);                    // bottom row
  quad([[-X, -Y, Z], [-X, Y, Z], [-X, Y, -Z], [-X, -Y, -Z]],
       [[0, 0], [0, 1], [0, 1], [0, 0]]);                    // left column
  quad([[X, Y, Z], [X, -Y, Z], [X, -Y, -Z], [X, Y, -Z]],
       [[1, 1], [1, 0], [1, 0], [1, 1]]);                    // right column

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  return g;
}

// --- parts ----------------------------------------------------------------
const movers = [];
const placed = new Map();          // part name -> the pivots it was placed as
for (const q of man.parts) {
  if (only && q.name !== only) continue;
  const tex = await load(`${dir}/${q.image}`);
  const ow = (q.u[1] - q.u[0]) * A, oh = q.v[1] - q.v[0];
  const R = q.resize || 'fixed';
  // A PART WITH NOTHING UNIFORM ON ITS SPAN AXIS MUST NOT SPAN. Told to run
  // the full width with no band to absorb the difference, the only thing left
  // to give is the artwork, and a marquee reading ARCADE came out with its
  // last letter stretched half the length of the sign. Holding its real size
  // and centring it is the honest answer: the source art says this part does
  // not grow, and inventing pixels to make it grow is worse than not growing.
  const sp = spansOf(q);
  const canX = sp.x, canY = sp.y;
  // grows by the difference, so at scale 1 it is exactly its own size
  const w = canX ? ow + (FW - A) : ow;
  // A MEMBER GAINS ITS OWN SHARE OF THE HEIGHT, NOT ALL OF IT. "oh + (FH - 1)"
  // hands a part the WHOLE prop's added height, which is right for something
  // that runs the full height and absurd for something that does not: a
  // pinball's leg is a third of the machine, so at 1.5x tall it gained one and
  // a half times its own length and the cabinet came back standing on stilts.
  //
  // gOfT already maps a drawn height to a grown one -- it is what positions
  // every part on this axis -- so the honest answer is the grown extent of the
  // member's own rows. A full-height part gets gOfT(1) - gOfT(0) = 1 and lands
  // on exactly the old value, so nothing that was right changes.
  //
  // Only for a member the body lengthens BY. An enclosure of tiers grows to
  // hold a shelf the body knows nothing about, and it must keep the old rule.
  const grownH = (gOfT(q.v[1]) - gOfT(q.v[0])) * FH;
  const h = !canY ? oh
    : q.lengthens ? Math.max(oh, grownH)
    : oh + (FH - 1);
  // STAND-OFF IS RELATIVE TO THE PART, NOT THE PROP. "deep" as a flat 5.5% of
  // the cabinet's height turns a coin slot into a tower, and the judge read
  // exactly that: "a small brown box floats clear off the front face". A part
  // may stand off about as far as its own smallest dimension allows.
  const CAP = { flush: 0.15, proud: 0.45, deep: 1.0, recessed: 0.45 };
  const cls = q.depth ?? 'proud';
  const d = Math.max(0.002, Math.min(Math.abs(DEPTH[cls] ?? DEPTH.proud),
                                     (CAP[cls] ?? 0.45) * Math.min(w, h)));
  // A PART THAT MOVES CANNOT BE BURIED. A recess is drawn as a face a hair
  // proud with its box sunk behind, which is right for a screen and wrong for
  // anything on a hinge: the box is inside the body, so swinging it sweeps
  // straight through the cabinet -- which is exactly what the second judge
  // reported about the access door. If it moves, it sits on the surface.
  const moves = (q.motion || 'none') !== 'none';
  const recessed = (cls === 'recessed') && !moves;

  // position on the face, from the same anchor arithmetic as layer_view
  const dTop = 1 - q.v[1], dBot = q.v[0];
  const cx = ((q.u[0] + q.u[1]) / 2 - 0.5) * A;
  let x, y;
  if (canX) x = 0;
  else x = xFor(q, w, FW, A);
  // A PART THAT GROWS DOWNWARDS IS NOT NECESSARILY THE WHOLE PROP. Centring
  // anything that spans on Y was safe while only full-height parts ever did:
  // the first part that grew vertically WITHOUT running the whole height --
  // the vending machine's display case, lengthening to hold another shelf --
  // was centred on the cabinet instead of staying where it is drawn, and slid
  // down over the keypad in the render at its ORIGINAL size, where nothing
  // should have moved at all. A part keeps the edge its anchor names and grows
  // away from it, which is what the anchor has always meant on the other axis.
  if (canY && (q.v[1] - q.v[0]) > 0.85) y = 0;
  else if (canY && q.lengthens) {
    // and it sits over the rows it grew into, which is where gOfT put them
    y = ((gOfT(q.v[0]) + gOfT(q.v[1])) / 2 - 0.5) * FH;
  } else if (canY) {
    const base = (gOfT((q.v[0] + q.v[1]) / 2) - 0.5) * FH;
    const grew = h - oh;
    y = q.anchor === 'top' ? base - grew / 2
      : q.anchor === 'bottom' ? base + grew / 2 : base;
  } else y = (gOfT((q.v[0] + q.v[1]) / 2) - 0.5) * FH;
  // MOUNT ON THE SURFACE, NOT ON A PLANE. With a shaped body the front is at a
  // different depth at every height, so a fixed z floated the control deck in
  // front of the deck it belongs to and buried the marquee in the slope.
  // MOUNT ON THE FRONTMOST SURFACE IT SPANS, NOT THE ONE AT ITS MIDDLE. The
  // body's front is at a different depth at every height, and a screen spans a
  // recess -- so a single z taken at the part's centre put the top of the
  // screen BEHIND the cabinet's own face, and the 3D view showed woodwork
  // where the display should be while the flat render of the same prop was
  // perfect. A part cannot be buried by the surface it is mounted on.
  // AND THE FRONT IS AT A DIFFERENT DEPTH ACROSS THE WIDTH TOO, once the plan
  // shapes the body: a coin door near a chamfered corner sits further back
  // than one at the centre, and sampling only down the height floated it.
  const yFrac = y / FH + 0.5;
  // A RECESSED PART CANNOT SIT BEHIND A SOLID FACE. Centring its box at
  // surf - d/2 puts its front face exactly ON the body's, and two coplanar
  // opaque faces z-fight: the vending machine's window came out as mottled
  // blue with the cans flickering away, which reads as a texture fault and is
  // not one. There is no hole in the body to sink into, so a recess is drawn
  // as a face a hair in front with its box buried behind -- the recession is
  // carried by the part's own dark bezel, which is where it was drawn anyway.
  const EPS = 0.002;

  // ONE PER BAY, AND IN 3D TOO. The flat view has instanced per-bay parts since
  // the two-player rule was written; the rig never did, so every judge that
  // looked at the SOLID render of a 2x cabinet said the same thing -- "the
  // widened deck gets a second button field with no second stick", "a wider
  // cabinet must be a two-player cabinet, it only has one joystick". The flat
  // picture was right and the actual model was not, which is the worse half to
  // be wrong in. The prop's own width is the unit: a cabinet twice as wide is
  // two bays, and anything the tool marked per_bay stands in each of them at
  // the same place within it. Deciding that per prop is the point -- the same
  // arithmetic on a jukebox would give it two turntables.
  // THE BAYS ARE LAID OUT ON WHAT THE PART STANDS ON, NOT ON THE WHOLE PROP.
  // Dividing the cabinet's full width into two put bay one's joystick out on
  // the bare flank, three hundred pixels clear of the deck it belongs to: the
  // deck does not run the full width and never claimed to. A station repeats
  // along its own structure, so the host's placed extent is the ruler.
  const host = hostSpan(q);
  // A BAY IS DEFINED BY THE STRUCTURE THE STATIONS STAND ON, so a part with no
  // structure under it has no bay to be one-per-of. This cabinet's scale rule
  // named its coin slots and coin returns per-bay along with the joysticks --
  // defensible as a sentence, since a second player does pay -- and the six of
  // them then had nothing to repeat ALONG, so they were laid out across the
  // whole face and both judges saw what they actually were: "the background
  // tiles the baked coin door across the lower front panel, duplicate phantom
  // coin doors". The joysticks and buttons stand on the deck and repeat with
  // it; the coin door stands on the cabinet, and a wider cabinet is still one
  // cabinet.
  const bays = (q.per_bay && host) ? Math.max(1, Math.round(FW / A)) : 1;
  const bayW = (host ? host.w : FW) / bays;
  const bx0 = host ? host.x - host.w / 2 : -FW / 2;
  // its place within one bay, measured from the host's own left edge
  const ox = host
    ? ((q.u[0] + q.u[1]) / 2 - (host.u[0] + host.u[1]) / 2) * A
    : ((q.u[0] + q.u[1]) / 2 - 0.5) * A;

  // AND ONE PER TIER, WHICH IS THE SAME SENTENCE ABOUT THE OTHER AXIS. Width
  // could always say "a bigger one has more of these" and height could only
  // stretch or hold, so a taller vending machine grew its product rows instead
  // of gaining one, and a taller jukebox got taller title strips. Nothing in
  // "more shelves, not taller shelves" is about width; the machinery just
  // never existed on the other axis.
  //
  // The prop's own height is the unit, exactly as its width is for bays: at
  // 1.5x there is one and a half tiers' worth of room, which is two tiers. The
  // tier is measured on the HOST, like a bay -- shelves repeat down the cabinet
  // they are in, not down the whole prop -- and the part keeps its offset
  // within its tier so a strip mounted near the top of one shelf stays near
  // the top of every shelf.
  const tiers = (q.per_tier && host) ? Math.max(1, Math.round(FH)) : 1;
  const hv = host?.v ?? [0, 1];
  const hy0 = (gOfT(hv[0]) - 0.5) * FH, hy1 = (gOfT(hv[1]) - 0.5) * FH;
  const tierH = (hy1 - hy0) / tiers;
  const oy = y - (hy0 + (hy1 - hy0) / 2);

  const m = q.motion || 'none';
  for (let b = 0; b < bays * tiers; b++) {
    const bi = b % bays, ti = (b / bays) | 0;
    const bx = bays > 1 ? bx0 + bayW * (bi + 0.5) + ox : x;
    const by = tiers > 1 ? hy0 + tierH * (ti + 0.5) + oy / tiers : y;
    // THE PIVOT IS THE POINT. A door that spins about its centre is not a door,
    // so the part hangs off a pivot placed on the edge its motion turns about,
    // and the mesh is offset back by the same amount inside it.
    // each bay lies in the surface under IT, not the one under the first bay
    // A STICK IS FIXED AT ITS FOOT, so that is where its surface is asked for.
    // The rest of a joystick is ball and shaft standing clear of the deck, and
    // asking what surface lies under the whole drawn box mixed the deck with
    // the bezel behind the ball: the median slope came back -0.06 on a deck
    // that runs at -2.08, the residual then failed, and the stick was mounted
    // square. A panel is held along its whole face and is asked about all of
    // it; a stick is held only where it enters the panel.
    const pl = m === 'stick' ? surfacePlane(bx, by - h * 0.35, w, h * 0.30)
                             : surfacePlane(bx, by, w, h);
    // ?fit=1 prints what surface each part decided it was lying on. Every
    // mounting fault so far has been invisible in the render and obvious in
    // these four numbers.
    if (p.get('fit') === '1') {
      console.log(`fit ${q.name.padEnd(22)} pitch ${(Math.atan(pl.c) * 57.3).toFixed(1).padStart(6)}`
        + `  yaw ${(Math.atan(-pl.b) * 57.3).toFixed(1).padStart(6)}`
        + `  seat ${pl.a.toFixed(3)}  frontmost ${pl.front.toFixed(3)}`
        + `  |  down k=${lastFit.dk.toFixed(2)} r=${lastFit.dr.toFixed(4)} ${lastFit.dok ? 'ok' : 'NO'}`
        + ` w=${(w * 0.8).toFixed(3)} h=${(h * 0.8).toFixed(3)}`
        + (pl.fitted ? '' : '   (step, not a slope: mounted square)'));
    }
    // CAPPED AT 45 DEGREES, BEYOND WHICH THE TWO DRAWINGS DISAGREE. With the
    // fit made robust, the control deck came back at -64 degrees: the profile
    // really does turn that steeply there, because that is the deck's front
    // LIP rather than its top, and a deck laid at 64 degrees stands nearly
    // upright. Past 45 a part has to grow by more than 40% to cover its own
    // footprint -- 1/cos -- which is the elevation and the profile disagreeing
    // about what the part is, not a surface to lie in. Holding it square is
    // the safer reading of a disagreement.
    const CAP = Math.PI / 4;
    // A PANEL LIES IN THE SURFACE; A STICK STANDS OUT OF IT. Both were rotated
    // the same way, so a joystick on a deck that lies back 65 degrees was laid
    // back 65 degrees WITH the deck -- a lever lying flat along the panel,
    // pointing up-slope, instead of rising out of it. The shaft runs along the
    // part's own +Y, and what a stick wants is for that to be the surface's
    // NORMAL, which is a quarter turn from the surface's own lean: on a
    // vertical wall a lever points forward, on a horizontal deck a joystick
    // points straight up, and on this cabinet's 65-degree deck it stands 26
    // degrees forward of vertical. Only when the surface was actually found --
    // an unfitted stick keeps pointing up, which is the safer guess and is
    // where it stood before.
    // AND NO STICK LEANS FURTHER THAN A STICK LEANS. Along the normal is the
    // right direction where the panel is near horizontal, and the further the
    // panel is from horizontal the less true it stays: on a deck lying back
    // only 36 degrees the normal is 54 degrees off vertical, and a joystick at
    // 54 degrees is lying down. Real sticks on angled panels stand nearer
    // upright than their panel's normal does, so the lean is bounded at 30.
    // On a horizontal deck the normal IS vertical and this never binds.
    const STICK_CAP = Math.PI / 6;
    // A STICK STANDS ON A SURFACE THAT FACES UP. The rule above turns the
    // surface's lean into the stick's, and it is only meaningful for a surface
    // a stick could be bolted through. A negative slope is a panel leaning back
    // as it rises -- a control deck. A POSITIVE one leans forward as it rises,
    // which is an underside or a front lip, and nothing stands on those.
    //
    // On this cabinet the segmenter drew the joystick boxes below the deck
    // rather than on it, so each stick fitted its own base to the deck's front
    // LIP and came back at +65 and +68 degrees where the deck itself is -66.
    // Adding the quarter turn put them at 155, the cap pulled that back to a
    // tidy-looking 30, and both graders independently reported the same thing:
    // "mounted under the front edge of the control deck pointing downwards
    // rather than standing upright on the control panel surface". The clamp was
    // not protecting against a steep surface, it was disguising the wrong one.
    // A fit that says the stick is under an overhang is a fit to disbelieve,
    // and an upright stick is the honest answer to not knowing.
    const stick = m === 'stick' && pl.fitted && pl.c < 0;
    // and a stick whose surface was not believed stands UP, rather than
    // falling through to the panel rule and lying in it: laid into a lip
    // fitted at +65 degrees it came out leaning 45 forward off the deck's
    // front edge, which is the fault, not a milder version of it.
    const rotX = m === 'stick'
      ? (stick ? Math.max(-STICK_CAP,
                          Math.min(STICK_CAP, Math.atan(pl.c) + Math.PI / 2))
               : 0)
      : Math.max(-CAP, Math.min(CAP, Math.atan(pl.c)));
    const rotY = Math.max(-CAP, Math.min(CAP, -Math.atan(pl.b)));
    // A SLOPE IS LONGER THAN ITS SHADOW. The elevation measures a part where it
    // projects, so a bezel drawn 0.30 tall covers 0.30/cos of actual slope --
    // laid in the plane at its drawn size the screen fell short of its own
    // opening by exactly the amount the cabinet leans.
    const bw = w / Math.max(0.35, Math.cos(rotY));
    const bh = h / Math.max(0.35, Math.cos(rotX));
    const geo = recessed ? recessGeometry(q, bw, bh, d)
                        : partGeometry(q, bw, bh, d);
    const inst = new THREE.Mesh(geo, new THREE.MeshBasicMaterial(
      { map: tex, transparent: true, alphaTest: 0.5,
        side: THREE.DoubleSide }));
    const pivot = new THREE.Object3D();
    let off = [0, 0, 0];
    if (m === 'hinge_left') off = [-bw / 2, 0, 0];
    else if (m === 'hinge_right') off = [bw / 2, 0, 0];
    else if (m === 'hinge_bottom') off = [0, -bh / 2, 0];
    else if (m === 'hinge_top') off = [0, bh / 2, 0];
    else if (m === 'stick') off = [0, -bh / 2, 0];
    pivot.rotation.set(rotX, rotY, 0);
    // the stand-off runs along the surface's own normal, so a part on a slope
    // stands off the slope rather than off the world
    const nrm = new THREE.Vector3(-pl.b, -pl.c, 1).normalize();
    const k = d / 2 + explode * 0.6;
    const seat = new THREE.Vector3(bx, by, pl.a).addScaledVector(nrm, k);
    // the hinge edge is an edge of the PART, so its offset turns with the part
    const offW = new THREE.Vector3(...off).applyEuler(pivot.rotation);
    pivot.position.copy(seat.clone().add(offW));
    inst.position.set(-off[0], -off[1], -off[2]);
    pivot.add(inst);
    const bsurf = pl.front;
    // NAME BOTH, AND RECORD THE MECHANISM. An exported rig is only editable if
    // the thing you select in a DCC tool tells you what it is and how it moves;
    // an anonymous Object3D_7 is no better than a merged mesh.
    pivot.name = (bays * tiers) > 1
      ? (tiers > 1 && bays > 1 ? `${q.name}_bay${bi + 1}_tier${ti + 1}`
         : tiers > 1 ? `${q.name}_tier${ti + 1}` : `${q.name}_bay${bi + 1}`)
      : q.name;
    inst.name = `${pivot.name}_mesh`;
    pivot.userData = { part: q.name, motion: m, depth: q.depth ?? 'proud',
                       resize: R, anchor: q.anchor,
                       ...(bays > 1 ? { bay: bi + 1, bays } : {}),
                       ...(tiers > 1 ? { tier: ti + 1, tiers } : {}) };
    scene.add(pivot);
    if (!placed.has(q.name)) placed.set(q.name, []);
    placed.get(q.name).push(pivot);
    // A DOOR HAS SOMETHING BEHIND IT. The background has the door's own shape
    // cut out of it, so swinging the door open showed straight through the
    // body to the inside of its back panel -- "the hinged-open door reveals a
    // flat untextured grey-green cavity", which is the one thing a door must
    // never do. A dark interior quad set just inside the opening costs two
    // triangles and turns a hole into a compartment, which is what is actually
    // there. Only for parts that open: nothing else ever exposes one.
    if (m.startsWith('hinge')) {
      const back = new THREE.Mesh(
        new THREE.PlaneGeometry(bw * 0.98, bh * 0.98), plain(0x100d0a));
      back.position.copy(seat.clone().addScaledVector(nrm, -Math.max(0.012, d * 0.9)));
      back.rotation.copy(pivot.rotation);
      back.name = `${pivot.name}_interior`;
      scene.add(back);
    }
    if (m !== 'none') movers.push({ pivot, motion: m, w: bw, h: bh, d,
                                    rest: pivot.rotation.clone() });
  }
}

// A RIDER TRAVELS WITH THE THING IT IS BOLTED TO.
//
// hostOf has been in this file, correct and never called, since the note above
// it was written -- so every part was added straight to the scene and a door
// swung open out from under its own fittings. Both judges say it every run, in
// the same words: "the coin slots detach and float far above the coin door
// assembly", "the door button boxes sit offset from the coin door face,
// floating beside the door rather than seated on it". It is not a placement
// fault; at rest they sit exactly right. It is a HIERARCHY fault, and it only
// shows in the driven-open render, which is why it reads as a positioning bug.
//
// attach() re-parents while preserving the world transform, so nothing moves
// at rest and everything moves together once the host does. Only hosts that
// actually MOVE are worth re-parenting -- a static deck and its joystick are
// already in the right places -- and only hosts placed exactly once, because a
// rider cannot be assigned to one of several instanced copies of its host
// without inventing which.
{
  let joined = 0;
  for (const q of man.parts) {
    const kids = placed.get(q.name);
    if (!kids || !kids.length) continue;
    const h = hostOf(q);
    if (!h || (h.motion || 'none') === 'none') continue;
    const hp = placed.get(h.name);
    if (!hp || hp.length !== 1) continue;
    for (const kid of kids) {
      hp[0].attach(kid);
      joined++;
      // attach() rewrites the local rotation to hold the world one, and the
      // motion driver swings each mover about the rest pose it recorded when
      // the pivot was built -- so a rider that moves in its own right (a
      // button that presses on a door that opens) would spring to a stale
      // angle the moment it was driven. Its rest is where it is NOW.
      for (const mv of movers) if (mv.pivot === kid) mv.rest.copy(kid.rotation);
    }
  }
  if (joined) console.log(`${joined} rider(s) parented to a moving host`);
}

// --- drive the motions ------------------------------------------------------
for (const mv of movers) {
  const t = anim;
  switch (mv.motion) {
    // A DOOR OPENS OUTWARD. Rotating +y about the left edge carries the free
    // edge to -z, i.e. into the cabinet, so at anim=1 the coin door was
    // swinging through the body instead of out of it -- invisible, and exactly
    // the sort of thing that looks like "the animation does not work".
    // ADDED TO THE REST POSE, NOT SUBSTITUTED FOR IT. A part now sits tilted
    // into the surface it is mounted on, so assigning a rotation outright
    // stood the deck's joysticks back up straight the moment anim went above
    // zero -- the animation undoing the mounting.
    case 'hinge_left': mv.pivot.rotation.y = mv.rest.y - t * 1.4; break;
    case 'hinge_right': mv.pivot.rotation.y = mv.rest.y + t * 1.4; break;
    case 'hinge_bottom': mv.pivot.rotation.x = mv.rest.x + t * 1.2; break;
    case 'hinge_top': mv.pivot.rotation.x = mv.rest.x - t * 1.2; break;
    case 'stick': mv.pivot.rotation.x = mv.rest.x - t * 0.6; break;
    case 'press': mv.pivot.position.z -= t * mv.d * 0.8; break;
    case 'slide_x': mv.pivot.position.x += t * mv.w * 0.6; break;
    case 'slide_y': mv.pivot.position.y -= t * mv.h * 0.6; break;
  }
}

const yaw = Number(p.get('yaw') ?? 0) * Math.PI / 180;
const pitch = Number(p.get('pitch') ?? 0) * Math.PI / 180;
// FRAME WHAT IS ACTUALLY THERE. layer_view fixes its camera on purpose, so
// that a prop made twice as tall DRAWS twice as tall and the judge is not
// fooled by re-normalisation. Nothing here varies the prop's size -- the
// variables are anim and explode -- so a fixed frame only means the prop sits
// small in the middle of a grey field, which is how the first parts sheet came
// out. Measure the scene instead, with the swung-open parts included.
// --- one sheet for the whole prop -------------------------------------------
//
// THIRTY-ONE MATERIALS AND TWENTY-SEVEN TEXTURES IS NOT AN ASSET, IT IS A
// SCENE. Every other measure of this prop was in range -- six thousand
// triangles, a clean hierarchy, named pivots -- and it would still come back
// from any art director in a studio, because a prop is budgeted in DRAW CALLS
// and this one cost thirty-one of them. The elevations, the two flanks, the
// top, and one image per cut-out part were each their own texture and their
// own material. A period prop of this kind shipped on one sheet.
//
// Nothing about the build has to change to fix it: the images are all already
// clamped, all already nearest-filtered with no mipmaps, and every UV is
// already inside the unit square. So they pack, the UVs move with them, and
// what was thirty-one materials is two -- the sheet, and the carcass tile,
// which cannot join it because it is the one map that WRAPS, and a wrapped
// texture in an atlas reads its neighbours. Nearest filtering means there is
// no bleed to guard against beyond a rounding pixel, so the gutter is two.
//
// Done before the render, not just before the export, because the picture the
// judge grades has to be the thing that ships. That distinction has already
// cost this tool two rounds of resize verdicts taken off a debugging view.
function atlasScene() {
  const meshes = [];
  scene.traverse((o) => { if (o.isMesh) meshes.push(o); });
  const keyOf = (m) => {
    if (!m.map) return `c:${m.color.getHexString()}`;
    if (m.map.wrapS === THREE.RepeatWrapping) return null;   // the tile stays
    if (!m.map.image?.width) return null;
    return `t:${m.map.image.src || m.map.uuid}`
      + `|${m.map.repeat.x},${m.map.repeat.y}|${m.map.offset.x},${m.map.offset.y}`;
  };
  const cells = new Map();
  for (const mh of meshes) {
    for (const m of (Array.isArray(mh.material) ? mh.material : [mh.material])) {
      const k = keyOf(m);
      if (k === null || cells.has(k)) continue;
      const img = m.map?.image;
      cells.set(k, { m, img, w: img ? img.width : 8, h: img ? img.height : 8 });
    }
  }
  if (cells.size < 2) return;
  // shelf packing, tallest first, into the smallest square that holds it
  const PAD = 2;
  const list = [...cells.values()].sort((a, b) => b.h - a.h);
  const fit = (S) => {
    let x = 0, y = 0, rowH = 0;
    for (const c of list) {
      const w = c.w + PAD * 2, h = c.h + PAD * 2;
      if (w > S || h > S) return false;
      if (x + w > S) { x = 0; y += rowH; rowH = 0; }
      if (y + h > S) return false;
      c.x = x + PAD; c.y = y + PAD;
      x += w; rowH = Math.max(rowH, h);
    }
    return true;
  };
  let W = 256;
  while (W < 4096 && !fit(W)) W *= 2;
  if (!fit(W)) return;                       // too much art to sheet: leave it
  const cv = document.createElement('canvas');
  cv.width = cv.height = W;
  const cx = cv.getContext('2d');
  cx.imageSmoothingEnabled = false;
  for (const c of list) {
    if (c.img) {
      // the gutter carries the edge pixels outward, so a UV that lands a
      // rounding error outside its cell still finds its own art
      cx.drawImage(c.img, c.x - PAD, c.y - PAD, c.w + PAD * 2, c.h + PAD * 2);
      cx.drawImage(c.img, c.x, c.y, c.w, c.h);
    } else {
      cx.fillStyle = `#${c.m.color.getHexString()}`;
      cx.fillRect(c.x - PAD, c.y - PAD, c.w + PAD * 2, c.h + PAD * 2);
    }
  }
  const sheet = new THREE.CanvasTexture(cv);
  sheet.magFilter = sheet.minFilter = THREE.NearestFilter;
  sheet.generateMipmaps = false;
  sheet.colorSpace = THREE.SRGBColorSpace;
  sheet.needsUpdate = true;
  // MASKED, NOT BLENDED. Every material on this prop was marked transparent
  // with an alpha test, and the two are not the same claim: transparent means
  // "mix me with what is behind", masked means "these texels are absent". The
  // pixels here are absent -- the cut-out margin of a part, the sheet showing
  // past a domed outline -- and saying blended costs real things outside this
  // renderer. glTF writes alphaMode BLEND for it, so the whole prop lands in
  // an engine's transparent pass: sorted per object rather than per pixel, no
  // depth write, and a coin door drawn behind the cabinet it is bolted to
  // depending on which way the camera faces. Dropping `transparent` while
  // keeping alphaTest changes nothing on screen -- the test discards the same
  // fragments either way -- and exports as MASK with a cutoff, which is what a
  // cut-out prop is and what its depth pass wants.
  const atlasMat = new THREE.MeshBasicMaterial(
    { map: sheet, side: THREE.DoubleSide, alphaTest: 0.5,
      vertexColors: true });
  atlasMat.name = 'prop_sheet';

  const move = (geo, start, count, cell, m) => {
    const uvA = geo.getAttribute('uv');
    if (!uvA) return;
    const rx = m.map ? m.map.repeat.x : 1, ry = m.map ? m.map.repeat.y : 1;
    const ox = m.map ? m.map.offset.x : 0, oy = m.map ? m.map.offset.y : 0;
    const idx = geo.index;
    const seen = new Set();
    for (let i = start; i < start + count; i++) {
      const v = idx ? idx.getX(i) : i;
      if (seen.has(v)) continue;
      seen.add(v);
      let u = uvA.getX(v), t = uvA.getY(v);
      if (m.map) { u = u * rx + ox; t = t * ry + oy; }
      else { u = 0.5; t = 0.5; }
      // clamped, which is exactly what these maps did before: three's default
      // wrap is clamp-to-edge and every one of them was on it
      u = Math.min(1, Math.max(0, u));
      t = Math.min(1, Math.max(0, t));
      uvA.setXY(v, (cell.x + u * cell.w) / W,
                   1 - (cell.y + (1 - t) * cell.h) / W);
    }
    uvA.needsUpdate = true;
  };

  for (const mh of meshes) {
    const geo = mh.geometry;
    // one material now wants vertex colours of everything, so anything without
    // them gets white ones rather than a second material to carry the lack
    if (!geo.getAttribute('color')) {
      const n = geo.getAttribute('position').count;
      geo.setAttribute('color',
        new THREE.Float32BufferAttribute(new Array(n * 3).fill(1), 3));
    }
    const mats = Array.isArray(mh.material) ? mh.material : [mh.material];
    const total = geo.index ? geo.index.count
                            : geo.getAttribute('position').count;
    const kept = [];                       // materials that could not be sheeted
    const slot = (m) => {
      let i = kept.indexOf(m);
      if (i < 0) { kept.push(m); i = kept.length - 1; }
      return i;
    };
    if (!geo.groups.length) {
      const c = cells.get(keyOf(mats[0]));
      if (c) { move(geo, 0, total, c, mats[0]); mh.material = atlasMat; }
      continue;
    }
    const groups = geo.groups.map((g) => ({ ...g }));
    geo.clearGroups();
    let anyAtlas = false;
    for (const g of groups) {
      const m = mats[g.materialIndex] || mats[0];
      const c = cells.get(keyOf(m));
      if (c) { move(geo, g.start, g.count, c, m); anyAtlas = true; }
      geo.addGroup(g.start, g.count, c ? -1 : slot(m));
    }
    const out = anyAtlas ? [atlasMat, ...kept] : kept;
    const base = anyAtlas ? 1 : 0;
    for (const g of geo.groups) {
      g.materialIndex = g.materialIndex < 0 ? 0 : g.materialIndex + base;
    }
    mh.material = out.length === 1 ? out[0] : out;
  }
  // ADJACENT GROUPS ON ONE MATERIAL ARE ONE DRAW CALL, so merge what the
  // sheeting just made contiguous -- the body's six faces were six groups and
  // are now one run of triangles on one map.
  for (const mh of meshes) {
    if (!mh.geometry.groups.length) continue;
    const gs = mh.geometry.groups.slice()
      .sort((a, b) => a.start - b.start);
    const merged = [];
    for (const g of gs) {
      const last = merged[merged.length - 1];
      if (last && last.materialIndex === g.materialIndex
          && last.start + last.count === g.start) last.count += g.count;
      else merged.push({ ...g });
    }
    mh.geometry.clearGroups();
    for (const g of merged) mh.geometry.addGroup(g.start, g.count, g.materialIndex);
  }
  const mats = new Set();
  scene.traverse((o) => {
    if (o.isMesh) {
      for (const m of (Array.isArray(o.material) ? o.material : [o.material])) {
        mats.add(m);
      }
    }
  });
  console.info(`sheet: ${cells.size} images -> one ${W}x${W} map, `
    + `${mats.size} materials on the prop`);
}
if (p.get('sheet') !== '0') atlasScene();

const bb = new THREE.Box3().setFromObject(scene);
const size = bb.getSize(new THREE.Vector3());
const mid = bb.getCenter(new THREE.Vector3());
const rad = Number(p.get('frame')
  ?? Math.max(size.x, size.y, size.z) * 0.5 * 1.12);
const cam = new THREE.OrthographicCamera(-rad, rad, rad, -rad, 0.01, 40);
// ?pan=x,y shifts the look-at point in units of the frame radius, so a close
// frame can be aimed at the deck or the coin door instead of always at the
// prop's centre. Inspection only -- the judge's shots leave it at 0,0.
{
  const [px, py] = (p.get('pan') ?? '0,0').split(',').map(Number);
  mid.x += (px || 0) * rad * Math.cos(yaw);
  mid.z -= (px || 0) * rad * Math.sin(yaw);
  mid.y += (py || 0) * rad;
}
const r = 8;
cam.position.set(mid.x + r * Math.cos(pitch) * Math.sin(yaw),
                 mid.y + r * Math.sin(pitch),
                 mid.z + r * Math.cos(pitch) * Math.cos(yaw));
cam.lookAt(mid);
// WIREFRAME, BECAUSE TEXTURE HIDES GEOMETRY. A prop can read perfectly in the
// three-quarter view and still be a mess underneath -- a part sunk into the
// body, a profile with a step that should not be there, faces stacked on faces.
// None of that is visible while every surface is carrying artwork, so the judge
// gets a pass with the artwork taken away and only the edges left.
if (p.get('wire') === '1') {
  scene.background = new THREE.Color('#101014');
  const lines = [];
  scene.traverse((o) => {
    if (o.isMesh) {
      lines.push([new THREE.LineSegments(
        new THREE.WireframeGeometry(o.geometry),
        new THREE.LineBasicMaterial({ color: 0x7fe3ff })), o]);
    }
  });
  for (const [ln, src] of lines) {
    src.getWorldPosition(ln.position);
    src.getWorldQuaternion(ln.quaternion);
    src.getWorldScale(ln.scale);
    src.visible = false;
    scene.add(ln);
  }
}
renderer.render(scene, cam);

// --- export ------------------------------------------------------------------
// A prop that exists only as a page is not an asset. Written out as glTF the
// hierarchy survives -- one node per named part, its pivot where the motion
// turns, the body separate -- which is the whole point of building it in parts
// rather than as one collapsed mesh.
if (p.get('export') === '1') {
  const { GLTFExporter } = await import(
    'three/examples/jsm/exporters/GLTFExporter.js');
  const rig = new THREE.Group();
  rig.name = (dir.split('/').pop() || 'prop');
  for (const child of [...scene.children]) rig.add(child);
  // AND IT NEEDS NORMALS, WHICH NOTHING HERE EVER ASKED FOR. Every surface on
  // this prop is unlit -- MeshBasicMaterial samples the artwork and stops --
  // so no normal was ever computed and none was ever missed. The exported
  // asset then had POSITION, TEXCOORD_0 and COLOR_0 on all thirty primitives
  // and NORMAL on none of them, which is a prop that cannot be lit: a glTF
  // consumer is required to flat-shade what it is given no normals for, and
  // most pipelines flag it. The renderer's own indifference is not the asset's.
  //
  // Every geometry here is non-indexed, so computeVertexNormals gives each
  // triangle its own face normal -- flat shading by construction, which is
  // what a faceted period prop wants anyway and what its silhouette already
  // implies. Done at export because it changes nothing on screen and belongs
  // to the deliverable rather than to the view.
  rig.traverse((o) => {
    if (o.isMesh && o.geometry && !o.geometry.getAttribute('normal')) {
      o.geometry.computeVertexNormals();
    }
  });
  const gltf = await new GLTFExporter().parseAsync(rig, { binary: false });
  globalThis.__gltf = JSON.stringify(gltf);
  console.info(`gltf: ${gltf.nodes?.length ?? 0} nodes, `
    + `${gltf.meshes?.length ?? 0} meshes`);
}

console.info(`parts: ${man.parts.length} parts, ${movers.length} movable `
  + `(${movers.map((m) => m.motion).join(', ') || 'none'}), anim=${anim}, `
  + `body=${profile ? `profile d${BODY_D.toFixed(3)}` : 'box'}`);
// handles for the shooter: name what is under a pixel, which is the only
// way to tell a body face from a part from a decal in a finished render
globalThis.__three = THREE;
globalThis.__scene = scene;
globalThis.__cam = cam;
globalThis.__done = true;
</script>
